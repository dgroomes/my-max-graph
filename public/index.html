<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>my-max-graph</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <style>
      :root {
        color-scheme: light;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: #26352f;
        background: #ffffff;
        font-synthesis: none;
      }

      * { box-sizing: border-box; }
      body { margin: 0; }
      button, input { font: inherit; }
      main { display: flex; height: 100dvh; }

      .sidebar {
        width: 248px;
        flex-shrink: 0;
        display: flex;
        flex-direction: column;
        gap: 28px;
        padding: 28px 20px 20px;
        overflow-y: auto;
        background: #f6f8f5;
        border-right: 1px solid #dfe6df;
      }

      h1 {
        display: flex;
        align-items: center;
        gap: 10px;
        margin: 0 0 12px;
        font-size: 18px;
        font-weight: 650;
        letter-spacing: -0.6px;
      }

      .brand-mark {
        display: grid;
        place-items: center;
        width: 28px;
        height: 28px;
        border: 1px solid #c9dacf;
        border-radius: 8px;
        color: #287852;
        background: #e7efe7;
        font-size: 23px;
      }

      .control-group { display: flex; flex-direction: column; gap: 10px; }
      .control-group label, .group-label {
        color: #738078;
        font-size: 11px;
        font-weight: 650;
        letter-spacing: 0.8px;
        text-transform: uppercase;
      }

      input {
        min-width: 0;
        width: 100%;
        padding: 11px 12px;
        border: 1px solid #dce3dc;
        border-radius: 7px;
        color: #26352f;
        background: #fff;
        font-size: 13px;
      }

      button {
        min-height: 38px;
        padding: 9px 10px;
        border: 1px solid #dce3dc;
        border-radius: 7px;
        color: #354b3e;
        background: #fff;
        font-size: 12px;
        font-weight: 550;
        cursor: pointer;
        transition: background 120ms, border-color 120ms;
      }

      button:hover:not(:disabled) { background: #edf4ed; border-color: #b4cbb9; }
      button:disabled { color: #9da79f; background: #f1f4ef; cursor: default; }
      button:focus-visible, input:focus-visible, textarea:focus-visible, .splitter:focus-visible {
        outline: 2px solid #398760;
        outline-offset: 2px;
      }
      .delete-button:hover:not(:disabled) { color: #a23d32; background: #fff1ed; border-color: #e8bcb3; }
      .button-row { display: flex; gap: 8px; }
      .button-row button { flex: 1; }
      .view-controls { border-top: 1px solid #dfe6df; padding-top: 20px; }
      .source-toggle { display: flex; align-items: center; justify-content: space-between; }
      .source-toggle[aria-expanded="true"] { background: #e8f1e9; border-color: #b7cfbe; }
      .code-symbol { margin-right: 10px; color: #7b9183; font-family: monospace; }

      .sidebar-footer {
        margin-top: auto;
        padding-top: 24px;
        display: flex;
        flex-direction: column;
        gap: 18px;
      }
      .connection { display: flex; align-items: center; gap: 9px; font-size: 12px; font-weight: 550; }
      .status-led {
        flex-shrink: 0;
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: #e8b553;
        box-shadow: 0 0 0 3px #e8b55318, 0 0 9px #e8b55388;
      }
      .connected .status-led {
        background: #42b979;
        box-shadow: inset 0 1px 2px #b4ffce, 0 0 0 3px #42b97918, 0 0 10px #42b97988;
      }
      .disconnected .status-led {
        background: #dd705e;
        box-shadow: inset 0 1px 2px #ffd0c6, 0 0 0 3px #dd705e18, 0 0 10px #dd705e88;
      }
      .last-edit { display: flex; flex-direction: column; gap: 7px; font-size: 11px; color: #7a857d; line-height: 1.6; }
      .activity { font-size: 11px; color: #7a857d; }
      .activity.warn { color: #b14d3a; }

      .workspace { display: flex; flex: 1; flex-direction: column; min-width: 0; overflow: hidden; }
      #graph { position: relative; flex: 1; min-height: 0; overflow: hidden; background: #fff; }
      #graph:focus { outline: none; }
      #graph:focus-visible { outline: 2px solid #398760; outline-offset: -2px; }
      .splitter {
        display: grid;
        place-items: center;
        flex: 0 0 9px;
        border-top: 1px solid #dfe6df;
        background: #f6f8f5;
        cursor: row-resize;
        touch-action: none;
      }
      .splitter::after { content: ""; width: 32px; height: 2px; border-radius: 2px; background: #c3cfc5; }
      .splitter:hover::after, .splitter:focus::after { background: #398760; }
      #xml-source {
        flex-grow: 0;
        flex-shrink: 0;
        min-height: 0;
        width: 100%;
        margin: 0;
        padding: 20px 24px;
        border: 0;
        resize: none;
        color: #43564a;
        background: #fafcf9;
        font: 12px/1.7 ui-monospace, SFMono-Regular, Menlo, monospace;
        tab-size: 2;
      }
      #xml-source:focus-visible { outline-offset: -2px; }

      @media (max-width: 600px) {
        .sidebar { width: 188px; padding: 20px 12px 16px; gap: 22px; }
        h1 { gap: 6px; font-size: 15px; }
        .brand-mark { width: 23px; height: 23px; font-size: 19px; }
        .button-row { gap: 5px; }
        button { padding: 9px 6px; font-size: 11px; }
        .connection { font-size: 11px; }
      }

      body.render-only main { height: 100vh; }
      body.render-only #graph { min-height: 100vh; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/app.js"></script>
  </body>
</html>
